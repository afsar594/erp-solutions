<div class="translator">
    <!-- <p-menu #menu [popup]="true" appendTo="body" [model]="items"></p-menu>
    <button type="button" pButton icon="pi pi-bars" label="Language" (click)="menu.toggle($event)"></button> -->
    <a style="font-size: 14px;
    color: #fff;display: inline-flex;cursor: pointer;
    align-items: center;
    text-align: center;
    background: #446793;
    padding: 4px 6px;
    border-radius: 12px;" (click)="app.onTopbarLangButtonClick($event)">
        <i class="pi pi-globe" ></i> 
        <span style="margin: 0 3px; font-weight: bold;">Languages</span>
        <i class="pi pi-angle-down" ></i> 
    </a>
    <ul id="topbar-menu" class="fadeInDown animated" [ngClass]="{'topbar-menu-visible': app.topbarlangActive}">
        <li class="lang-Items menuItem" (click)="useLanguage('en-US', 'ltr')">
            <a href="Javascript:void(0)"> <i class="topbar-icon fa fa-fw fa-language"></i>
            <span class="topbar-item-name"> English</span></a>

        </li>

        <li class="lang-Items menuItem" (click)="useLanguage('ar-SA','rtl')">
            <a href="Javascript:void(0)"> <i class="topbar-icon fa fa-fw fa-language"></i>
                <span class="topbar-item-name"> Arabic</span></a>
        </li>

        <li class="lang-Items menuItem" (click)="useLanguage('ml-MA','ltr')">
            <a href="Javascript:void(0)"> <i class="topbar-icon fa fa-fw fa-language"></i>
                <span class="topbar-item-name"> Malayalam</span></a>
        </li>
    </ul>
</div>
