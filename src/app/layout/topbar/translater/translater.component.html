<div class="translator">
  <button
    type="button"
    class="translator__trigger"
    (click)="app.onTopbarLangButtonClick($event)"
  >
    <i class="pi pi-globe"></i>
    <span>Languages</span>
    <i class="pi pi-angle-down"></i>
  </button>

  <ul
    class="lang-menu"
    [ngClass]="{ 'lang-menu--visible': app.topbarlangActive }"
  >
    <li class="lang-Items menuItem" (click)="useLanguage('en-US', 'ltr')">
      <i class="pi pi-globe"></i>
      <a href="Javascript:void(0)">
        <span class="topbar-item-name">English</span>
      </a>
    </li>

    <li class="lang-Items menuItem" (click)="useLanguage('ar-SA', 'rtl')">
      <i class="pi pi-globe"></i>
      <a href="Javascript:void(0)">
        <span class="topbar-item-name">Arabic</span>
      </a>
    </li>

    <li class="lang-Items menuItem" (click)="useLanguage('ml-MA', 'ltr')">
      <i class="pi pi-globe"></i>
      <a href="Javascript:void(0)">
        <span class="topbar-item-name">Malayalam</span>
      </a>
    </li>
  </ul>
</div>
